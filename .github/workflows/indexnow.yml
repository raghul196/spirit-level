name: IndexNow Ping

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "spiritlevel.online",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://spiritlevel.online/${{ secrets.INDEXNOW_KEY }}.txt",
              "urlList": [
                "https://spiritlevel.online/",
                "https://spiritlevel.online/de/",
                "https://spiritlevel.online/es/",
                "https://spiritlevel.online/it/",
                "https://spiritlevel.online/fr/",
                "https://spiritlevel.online/pt/"
              ]
            }'
